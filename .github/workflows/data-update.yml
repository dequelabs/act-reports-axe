name: Axe data update
on:
  workflow_dispatch:
  schedule:
    # Weekly, Saturday 00:00 UTC, after the work week has landed
    - cron: '0 0 * * 6'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch origin act-reports-axe
      - run: git checkout act-reports-axe
      - uses: actions/setup-node@v4
      - uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            !**/node_modules/.cache
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      # Install after the branch switch so the cache and postinstall build
      # match act-reports-axe, including the compiled act-tools CLI.
      - run: yarn install --frozen-lockfile
      ## Make sure we have the latest stable version of axe-core
      - run: yarn upgrade axe-core@latest
      # Compile act-tools in place. Its postinstall build does not run here,
      # and a stale tsbuildinfo makes `tsc` exit without writing dist/.
      - run: |
          rm -rf node_modules/act-tools/dist
          rm -f node_modules/act-tools/tsconfig.tsbuildinfo
          ./node_modules/.bin/tsc -p node_modules/act-tools --pretty false
          test -f node_modules/act-tools/dist/cli/map-implementation.js
      - run: yarn cleanup:core
      - run: yarn report
      - name: Git configure
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
      - run: git add reports/. package.json yarn.lock
      # Commit if there's anything staged
      - run: git diff-index --quiet HEAD || git commit -m "Weekly update of axe ACT reports" --no-verify
      - run: git push
